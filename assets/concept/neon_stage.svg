<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1010" width="1200" height="1010" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <!-- 디렉터 시안 (v0.6.1): 네온 리듬 무대 한 장면 + 장애물 세 종류 정면. 직접 제작. 값은 ART_BIBLE.md 1·4·10장 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05040D"/><stop offset="0.82" stop-color="#05040D"/><stop offset="1" stop-color="#241650"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241650"/><stop offset="0.16" stop-color="#0C0A1C"/><stop offset="1" stop-color="#0C0A1C"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0.75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3358"/><stop offset="1" stop-color="#120E24"/></linearGradient>
    <radialGradient id="pool"><stop offset="0" stop-color="#FF2FA8" stop-opacity="0.45"/><stop offset="1" stop-color="#FF2FA8" stop-opacity="0"/></radialGradient>
    <radialGradient id="hero"><stop offset="0" stop-color="#EAFFFF"/><stop offset="0.4" stop-color="#86E3E6" stop-opacity="0.75"/><stop offset="1" stop-color="#2F97A8" stop-opacity="0.9"/></radialGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#86E3E6" stop-opacity="0.5"/><stop offset="1" stop-color="#86E3E6" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="1200" height="1010" fill="#0A0914"/>
  <text x="40" y="44" font-size="26" fill="#fff" font-weight="700">v0.6.0 네온 리듬 무대: 어두운 무대 위의 말랑한 민트 젤리</text>

  <!-- 무대 한 장면 (세로 화면) -->
  <g transform="translate(40 70)">
    <clipPath id="stage"><rect width="520" height="920" rx="10"/></clipPath>
    <g clip-path="url(#stage)">
      <rect width="520" height="380" fill="url(#sky)"/>
      <rect y="380" width="520" height="540" fill="url(#floor)"/>
      <!-- 빛 줄기 -->
      <g stroke="#fff" stroke-width="1.6" opacity="0.4">
        <line x1="44" y1="500" x2="10" y2="570"/><line x1="90" y1="440" x2="66" y2="486"/>
        <line x1="476" y1="510" x2="512" y2="582"/><line x1="432" y1="438" x2="456" y2="486"/>
        <line x1="30" y1="330" x2="4" y2="300"/><line x1="492" y1="320" x2="516" y2="292"/>
      </g>
      <!-- 난간: 굵은 보라 네온 + 흰빛 심 -->
      <g filter="url(#glow)" fill="none" stroke-linecap="round">
        <path d="M222 382 L6 920" stroke="#7B5CFF" stroke-width="9"/><path d="M298 382 L514 920" stroke="#7B5CFF" stroke-width="9"/>
        <path d="M222 382 L6 920" stroke="#fff" stroke-width="2.4"/><path d="M298 382 L514 920" stroke="#fff" stroke-width="2.4"/>
      </g>
      <!-- 레인 구분: 짧은 빛 대시 -->
      <g stroke="#7B5CFF" stroke-linecap="round">
        <path d="M250 400 L247 412" stroke-width="2"/><path d="M270 400 L273 412" stroke-width="2"/>
        <path d="M239 450 L232 476" stroke-width="3"/><path d="M281 450 L288 476" stroke-width="3"/>
        <path d="M215 540 L200 590" stroke-width="4"/><path d="M305 540 L320 590" stroke-width="4"/>
        <path d="M172 700 L146 776" stroke="#B9A8FF" stroke-width="6"/><path d="M348 700 L374 776" stroke="#B9A8FF" stroke-width="6"/>
      </g>
      <!-- 먼 장애물: 멀리서도 실루엣과 기호 -->
      <g filter="url(#glow)">
        <g><rect x="232" y="404" width="20" height="10" rx="2" fill="#120E24" stroke="#FF9A1F" stroke-width="1.5"/><path d="M238 411 L242 406 L246 411" fill="none" stroke="#FFD08A" stroke-width="1.6"/></g>
        <g><rect x="270" y="392" width="16" height="30" rx="2" fill="#1C6FB0" stroke="#2FB8FF" stroke-width="1.5"/></g>
      </g>
      <!-- 슬라이드 블록과 빛 웅덩이 -->
      <ellipse cx="256" cy="590" rx="66" ry="17" fill="url(#pool)"/>
      <g filter="url(#glow)">
        <rect x="204" y="490" width="106" height="52" rx="7" fill="#120E24" stroke="#FF2FA8" stroke-width="3"/>
        <rect x="210" y="482" width="94" height="10" rx="4" fill="url(#top)"/>
        <path d="M236 505 L257 526 L278 505" fill="none" stroke="#FF9AD8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <!-- 옆 블록 + 바닥 반사 -->
      <g opacity="0.3"><rect x="350" y="640" width="82" height="96" rx="6" fill="#1C6FB0" stroke="#2FB8FF" stroke-width="3"/></g>
      <g filter="url(#glow)">
        <rect x="350" y="482" width="82" height="158" rx="7" fill="#1C6FB0" stroke="#2FB8FF" stroke-width="3"/>
        <rect x="356" y="474" width="70" height="10" rx="4" fill="#6FB4E6"/>
      </g>
      <!-- 주인공: 화면에서 가장 밝다 -->
      <ellipse cx="260" cy="812" rx="118" ry="52" fill="url(#halo)"/>
      <g filter="url(#glow)">
        <path d="M204 816 C204 748 228 722 260 722 C292 722 316 748 316 816 C316 824 306 830 296 830 L224 830 C214 830 204 824 204 816 Z" fill="url(#hero)" stroke="#C8FFFA" stroke-width="4"/>
        <path d="M226 758 C232 744 244 736 256 734" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      </g>
      <text x="260" y="130" text-anchor="middle" font-size="86" fill="#fff" fill-opacity="0.85" font-weight="200">128</text>
    </g>
  </g>

  <!-- 장애물 세 종류 정면 -->
  <g transform="translate(610 70)">
    <rect width="550" height="920" rx="10" fill="#0C0A1C"/>
    <text x="24" y="44" font-size="22" fill="#fff" font-weight="700">장애물 세 종류 (정면, 크기 비례)</text>
    <text x="24" y="72" font-size="16" fill="#AAA6C8">불투명 몸통 · 둥글게 깎은 모서리 · 색 빛 테두리 · 점프·슬라이드 기호 50~60%</text>
    <g filter="url(#glow)">
      <!-- 옆으로: 1.1 x 2.1 -->
      <rect x="44" y="130" width="146" height="280" rx="14" fill="#1C6FB0" stroke="#2FB8FF" stroke-width="5"/>
      <rect x="58" y="136" width="118" height="14" rx="6" fill="#6FB4E6"/>
      <!-- 점프: 1.3 x 0.45 -->
      <rect x="226" y="350" width="174" height="60" rx="11" fill="#120E24" stroke="#FF9A1F" stroke-width="5"/>
      <path d="M266 389 L313 371 L360 389" fill="none" stroke="#FFD08A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- 슬라이드: 1.3 x 0.7, 0.62 위에 뜸 -->
      <rect x="226" y="130" width="174" height="94" rx="13" fill="#120E24" stroke="#FF2FA8" stroke-width="5"/>
      <path d="M266 160 L313 195 L360 160" fill="none" stroke="#FF9AD8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <ellipse cx="313" cy="302" rx="78" ry="14" fill="url(#pool)"/>
    <line x1="24" y1="411" x2="526" y2="411" stroke="#3A3358" stroke-width="2"/>
    <g font-size="18" fill="#fff">
      <text x="117" y="446" text-anchor="middle">옆으로: 파란 기둥</text>
      <text x="313" y="446" text-anchor="middle">점프 ^ (아래) · 슬라이드 v (위)</text>
    </g>
    <g font-size="16" fill="#AAA6C8">
      <text x="24" y="500">밝기 순서</text>
      <text x="24" y="528" fill="#fff">주인공 &gt; 기호 &gt; 테두리·파란 기둥 &gt; 난간 &gt; 빛 줄기 &gt; 바닥·하늘</text>
      <text x="24" y="580">색 뜻: 파랑 #2FB8FF 옆, 주황 #FF9A1F 위, 분홍 #FF2FA8 아래</text>
      <text x="24" y="608">민트는 주인공 전용</text>
      <text x="24" y="660">하늘: 거의 검정 + 지평선 보라 안개 띠</text>
      <text x="24" y="688">길: #0C0A1C 반사 바닥, 난간 #7B5CFF + 흰빛 심, 박마다 빛 대시</text>
      <text x="24" y="716">빛 줄기: 속도에 비례해 개수와 길이 증가</text>
      <text x="24" y="768">지나간 장애물: 깨지지 않고 그대로 뒤로 지나감</text>
      <text x="24" y="820">다른 게임의 블록 디자인·기호·레이아웃을 베끼지 않는다.</text>
      <text x="24" y="848">분위기와 연출 방식만 참고.</text>
    </g>
  </g>
</svg>
