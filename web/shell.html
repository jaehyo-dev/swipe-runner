		<script>
// v0.12.2 발열: window.lowRate가 참이면(메인 화면·일시정지·게임 오버·설정) 엔진 프레임을 30fps로. rAF 시각이 다음 목표 시각(33.3ms씩 누적, 4ms 여유)에 못 미치면 다음 rAF로 미룬다
// (누적: 75Hz처럼 30의 배수가 아닌 화면도 2·3칸을 번갈아 평균 30fps)
// (Engine.max_fps는 웹에서 get_ticks 누적 비교라 60Hz에서 30으로 맞추면 지터로 들쭉날쭉하다). 화면 갱신 간격 측정은 원래 rAF(window.rawRAF)
{
	const raw = window.rawRAF = window.requestAnimationFrame.bind(window);
	const GAP = 1000 / 30;
	let frameAt = -1, due = 0, pass = true;
	window.lowRate = false;
	window.requestAnimationFrame = cb => raw(function run(t) {
		if (t !== frameAt) {  // 같은 프레임의 콜백은 같은 판정
			frameAt = t;
			pass = !window.lowRate || t >= due - 4;
			if (pass) due = t - due > GAP || !window.lowRate ? t + GAP : due + GAP;  // 많이 밀렸거나 제한 전이면 지금부터 다시 센다
		}
		if (pass) cb(t); else raw(run);
	});
}
// iOS: 두 번 탭 확대·핀치 확대 제스처를 막는다 (숨은 성능 표시의 세 번 탭이 확대로 먹히지 않게). 터치 자체는 엔진이 받는다
for (const type of ['dblclick', 'gesturestart']) document.addEventListener(type, e => e.preventDefault(), { passive: false });
// 홈 화면 앱(v0.12.0). 게임(main.gd)이 메인 화면에서 2초마다(v0.12.2) state()·insets()를 읽고, 버튼을 누르면 act()
// versions/ 아래 옛 버전 페이지는 서비스 워커·안내를 쓰지 않는다 (지금 버전만 앱)
window.pwa = (function () {
	const old = location.pathname.includes('/versions/');
	const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
	const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	const query = new URLSearchParams(location.search);
	let closed = false, install = null, reg = null, reloading = false;
	try { closed = localStorage.getItem('pwaHintClosed') === '1'; } catch (e) { /* 저장소를 못 쓰면 매번 보인다 */ }
	window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); install = e; });
	window.addEventListener('appinstalled', () => { install = null; });
	const register = () => {
		navigator.serviceWorker.register('index.service.worker.js').then((r) => {
			reg = r;
			// 앱으로 돌아올 때 새 버전이 있는지 다시 본다 (아이폰 홈 화면 앱은 다시 불러오지 않고 이어지기만 한다)
			document.addEventListener('visibilitychange', () => { if (!document.hidden) r.update().catch(() => {}); });
		}, (e) => console.warn('서비스 워커 등록 실패', e));
		navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloading) location.reload(); });
	};
	if ('serviceWorker' in navigator && !old && location.protocol !== 'file:') {
		// 게임이 첫 화면을 그린 뒤 등록: 첫 방문의 엔진 받기와 겹치지 않고, 설치는 방금 받은 파일(HTTP 캐시)을 쓴다
		const wait = () => (window.gameReady ? register() : setTimeout(wait, 500));
		wait();
	}
	let probe = null;
	return {
		state() {
			const flags = [];
			if (reg && reg.waiting && navigator.serviceWorker.controller) flags.push('update');
			if (!old && !standalone && ios && !closed) flags.push('ios');
			if (!old && !standalone && install) flags.push('install');
			return flags.join();
		},
		// 안전 영역 "위,오른쪽,아래,왼쪽,창 너비,창 높이" (CSS px). ?safe=59,0,34,0 은 노치 흉내 (화면 확인용)
		insets() {
			if (!probe) {
				probe = document.createElement('div');
				probe.style.cssText = 'position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;'
					+ 'padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
				document.body.appendChild(probe);
			}
			const s = getComputedStyle(probe);
			const v = query.get('safe') || [s.paddingTop, s.paddingRight, s.paddingBottom, s.paddingLeft].map(parseFloat).join();
			return v + ',' + innerWidth + ',' + innerHeight;
		},
		act(name) {
			if (name === 'update' && reg && reg.waiting) {
				reloading = true;
				reg.waiting.postMessage('skip');  // 새 서비스 워커가 바뀌면 controllerchange → 다시 불러오기
				setTimeout(() => location.reload(), 3000);  // 바뀜 알림이 오지 않아도
			} else if (name === 'install' && install) {
				// 터치는 손을 뗄 때 사용자 활성화가 생긴다 (게임은 누르는 순간 부른다): 이미 활성이면 바로, 아니면 손을 뗄 때 설치 창을 연다 (Codex 지적)
				const ask = () => {
					const e = install;
					if (!e) return;
					install = null;  // 한 번만 쓸 수 있다
					Promise.resolve(e.prompt()).catch(() => { install = e; });  // 거부되면 다시 누를 수 있게
				};
				if (navigator.userActivation && navigator.userActivation.isActive) ask();
				else document.addEventListener('pointerup', ask, { once: true, capture: true });
			} else if (name === 'close') {
				closed = true;
				try { localStorage.setItem('pwaHintClosed', '1'); } catch (e) { /* 이번 실행 동안만 닫힘 */ }
			}
		},
	};
}());
// 로딩 막대. 엔진 스크립트보다 먼저 돌아 첫 화면부터 보인다
(function () {
	const loading = document.getElementById('loading');
	const fill = document.getElementById('loading-fill');
	// 구간: [시작, 끝]. 실제 진행(0~1)을 구간 안에 놓는다
	const PHASES = { download: [0, 0.7], start: [0.7, 0.78], prep: [0.78, 1] };
	const CREEP = 0.004;  // 진행이 멈춰 있을 때 구간 끝까지 남은 거리의 이 비율씩 (프레임마다) 다가간다
	let phase = 'download', real = 0, shown = 0;
	window.loadingSet = (name, k) => { phase = name; real = Math.max(real, Math.min(1, Math.max(0, k))); };
	window.loadingPhase = (name) => { phase = name; real = 0; };
	const tick = () => {
		const [a, b] = PHASES[phase];
		const prep = phase === 'prep' ? (window.gamePrep || 0) : real;
		const target = a + (b - a) * prep;
		// 실제 진행이 앞서면 따라가고, 멈춰 있으면 구간 끝 쪽으로 아주 천천히 (끝에는 닿지 않는다)
		shown = Math.max(shown + (target - shown) * 0.25, shown + (b - shown) * CREEP);
		shown = Math.min(shown, b - 0.002);
		if (window.gameReady) {
			fill.style.transform = 'scaleX(1)';
			loading.style.opacity = '0';
			setTimeout(() => loading.remove(), 320);
			return;
		}
		fill.style.transform = `scaleX(${shown})`;
		requestAnimationFrame(tick);
	};
	// 로딩 화면이 처음 그려진 시각 (측정용): 글꼴이 준비된 다음 프레임
	document.fonts.load("200 10px 'PoppinsXL'").finally(() => requestAnimationFrame(() => { window.loadingShown = performance.now(); }));
	requestAnimationFrame(tick);
}());
		</script>

		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
GODOT_CONFIG.serviceWorker = '';  // 엔진이 시작하자마자 등록하지 않게: window.pwa가 첫 화면 뒤에, 지금 버전에서만 등록한다
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusNotice = document.getElementById('status-notice');

	function displayFailureNotice(err) {
		console.error(err);
		const text = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'An unknown error occurred.');
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
		statusNotice.style.display = 'block';
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		displayFailureNotice('Error\nThe following features required to run Godot projects on the Web are missing:\n' + missing.join('\n'));
		return;
	}
	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				window.loadingSet('download', current / total);
				if (current >= total) {
					window.loadingPhase('start');
				}
			}
		},
	}).then(() => {
		window.loadingPhase('prep');  // 엔진이 돌기 시작했다: 이제 게임이 준비 진행을 알린다
	}, displayFailureNotice);
}());
		</script>
